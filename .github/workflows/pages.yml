# Builds the game and publishes it to GitHub Pages: your own site, which only
# people with push access to this repository can change.
# Setup (once): Settings → Pages → Source: "GitHub Actions". The Firebase web
# config comes from firebase-web-config.json (or a FIREBASE_CONFIG variable).
# See SELF_HOSTING.md.
name: Deploy site

on:
  push:
    branches: [main, claude/new-session-v5w417]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The Firebase web config: the FIREBASE_CONFIG repository variable if set, else firebase-web-config.json.
      # (It identifies the project; it isn't a secret. The database rules are what protect the data.)
      - run: |
          CFG="$FIREBASE_CONFIG_VAR"
          if [ -z "$CFG" ] && [ -f firebase-web-config.json ]; then CFG="$(cat firebase-web-config.json)"; fi
          if [ -z "$CFG" ]; then echo "::warning::No Firebase config yet: the site builds without sign-in or online play."; fi
          VITE_FIREBASE_CONFIG="$CFG" npm run build:site
        env:
          FIREBASE_CONFIG_VAR: ${{ vars.FIREBASE_CONFIG }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
